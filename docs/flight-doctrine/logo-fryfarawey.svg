<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="220" height="220" fill="#050814"/>

  <!-- 中心の円：今ここ／旧文明 -->
  <circle cx="110" cy="120" r="46" fill="none" stroke="#4fd1c5" stroke-width="2" opacity="0.7"/>

  <!-- 斜めに伸びる軌道：未来方向 -->
  <line x1="110" y1="120" x2="178" y2="52"
        stroke="#805ad5" stroke-width="3" stroke-linecap="round"/>

  <!-- 軌道の先の光点：自分磁億 -->
  <circle cx="178" cy="52" r="6" fill="#f6e05e"/>

  <!-- 外側の弧：宇宙へ飛び出す FryFarawey の軌道 -->
  <path d="M 60 170
           A 90 90 0 0 1 170 60"
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

  <!-- テキスト：FryFarawey -->
  <text x="110" y="195" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="16" fill="#ffffff" letter-spacing="4">
    FRYFARAWEY
  </text>
</svg>
