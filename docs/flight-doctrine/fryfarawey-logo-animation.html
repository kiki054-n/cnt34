<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FryFarawey Logo Animation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: "Noto Sans JP", system-ui, sans-serif;
    color: #fff;
  }

  /* 画面全体 */
  #stage {
    position: fixed;
    width: 100%;
    height: 100%;
  }

  /* ロゴ本体 */
  #logo {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 260px;
    height: 260px;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 2s ease;
  }

  /* 文明コード */
  #code {
    position: absolute;
    bottom: 8%;
    width: 100%;
    text-align: center;
    font-size: 1rem;
    letter-spacing: 0.15em;
    opacity: 0;
    transition: opacity 2s ease;
  }
</style>
</head>

<body>

<canvas id="stage"></canvas>

<!-- ロゴSVG -->
<div id="logo">
<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="260" height="260" fill="#050505"/>
  <defs>
    <linearGradient id="blueMoment" x1="0" y1="260" x2="0" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="40%" stop-color="#0a1a33"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="260" height="260" fill="url(#blueMoment)" opacity="0.55"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="40" cy="60" r="1.2"/>
    <circle cx="120" cy="30" r="1.4"/>
    <circle cx="200" cy="80" r="1.1"/>
    <circle cx="180" cy="150" r="1.3"/>
    <circle cx="70" cy="180" r="1.0"/>
    <circle cx="220" cy="200" r="1.2"/>
  </g>
  <line x1="90" y1="170" x2="190" y2="70"
        stroke="#7fa8ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="190" cy="70" r="7" fill="#f6e05e"/>
  <line x1="30" y1="200" x2="230" y2="200"
        stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
</div>

<div id="code">
  Open Source We Use.<br>
  then Make Something.<br>
  then fryfarawey The Future！
</div>

<script>
  /* 星空アニメーション（宇宙を夢見る） */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let w, h, stars;

  function init() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    stars = Array.from({ length: 400 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      z: Math.random() * 2 + 0.2,
      r: Math.random() * 1.2,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "white";

    stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      s.y += s.z;
      if (s.y > h) s.y = 0;
    });

    requestAnimationFrame(draw);
  }

  init();
  draw();
  window.onresize = init;

  /* ロゴの出現タイミング（ブルーモーメント→ウインドカーム→ロゴ） */
  setTimeout(() => {
    document.getElementById("logo").style.opacity = 1;
  }, 3500);

  setTimeout(() => {
    document.getElementById("code").style.opacity = 1;
  }, 5500);
</script>

</body>
</html>
