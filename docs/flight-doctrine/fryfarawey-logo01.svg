<svg width="260" height="260" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">

  <!-- 炭の黒（背景） -->
  <rect width="260" height="260" fill="#050505"/>

  <!-- ブルーモーメントのグラデーション -->
  <defs>
    <linearGradient id="blueMoment" x1="0" y1="260" x2="0" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="40%" stop-color="#0a1a33"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="260" height="260" fill="url(#blueMoment)" opacity="0.55"/>

  <!-- 星空（粒子） -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="40" cy="60" r="1.2"/>
    <circle cx="120" cy="30" r="1.4"/>
    <circle cx="200" cy="80" r="1.1"/>
    <circle cx="180" cy="150" r="1.3"/>
    <circle cx="70" cy="180" r="1.0"/>
    <circle cx="220" cy="200" r="1.2"/>
  </g>

  <!-- CNT34の軌道（未来方向） -->
  <line x1="90" y1="170" x2="190" y2="70"
        stroke="#7fa8ff" stroke-width="3" stroke-linecap="round"/>

  <!-- 自分磁億の光点 -->
  <circle cx="190" cy="70" r="7" fill="#f6e05e"/>

  <!-- ウインドカームの水平線 -->
  <line x1="30" y1="200" x2="230" y2="200"
        stroke="#ffffff" stroke-width="1" opacity="0.3"/>

  <!-- 文明コード -->
  <text x="130" y="235" text-anchor="middle"
        font-family="system-ui, sans-serif"
        font-size="12" fill="#ffffff" opacity="0.85" letter-spacing="2">
    Open Source We Use. then Make Something. then fryfarawey The Future!
  </text>

</svg>
